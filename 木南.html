<body class="bg-[#F3F4F6] dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 antialiased selection:bg-pink-500 selection:text-white">

  <!-- 主卡片容器 -->
  <main class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl shadow-slate-200/70 dark:shadow-black/50 border border-slate-100 dark:border-slate-800 overflow-hidden transition-all">
    
    <!-- 頂部 IG 漸層橫幅與標題 -->
    <header class="bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] p-6 text-white relative overflow-hidden">
      <!-- 裝飾光暈 -->
      <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/15 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -left-8 -bottom-8 w-24 h-24 bg-yellow-300/20 rounded-full blur-xl pointer-events-none"></div>

      <div class="relative z-10 flex items-center gap-3.5">
        <!-- IG 風格訊息圖示 (Inline SVG) -->
        <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center shrink-0 border border-white/30 shadow-inner">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">IG 訊息快速傳送器</h1>
          <p class="text-white/95 text-xs sm:text-sm mt-0.5 leading-snug">點擊發送時會自動複製文字，並透過官方通道喚醒 IG</p>
        </div>
      </div>
    </header>

    <!-- 卡片內容區 -->
    <div class="p-5 sm:p-6 space-y-5">

      <!-- 訊息提示橫幅 (替代 alert()) -->
      <div id="statusToast" role="alert" class="rounded-2xl p-3.5 text-xs sm:text-sm font-medium flex items-start gap-2.5 transition-all duration-200 bg-emerald-50 text-emerald-800 border border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-200 dark:border-emerald-800/60">
        <span id="statusIcon" class="text-base leading-none mt-0.5">✅</span>
        <span id="statusText" class="flex-1 leading-relaxed">已複製原始碼！可貼入備忘錄並存成 .html 檔案獨立使用。</span>
      </div>

      <!-- 1. 指定聯絡人區塊（核心/自動記憶） -->
      <section class="space-y-2">
        <div class="flex items-center justify-between">
          <label for="usernameInput" class="text-sm font-semibold text-slate-700 dark:text-slate-200">
            對方的 IG 帳號 <span class="text-xs font-normal text-slate-400 ml-1">(不含 @，自動記憶)</span>
          </label>
          <button type="button" id="clearUserBtn" class="hidden text-xs text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 font-medium transition-colors px-2 py-0.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50 cursor-pointer" title="清除記憶的帳號">
            清除
          </button>
        </div>

        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-400 font-medium select-none">@</span>
          <input type="text" id="usernameInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例如：zuck（留空則開啟收件匣）" class="w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 pl-8 pr-4 py-3.5 text-base text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 focus:bg-white dark:focus:bg-slate-800 transition-all">
        </div>
      </section>

      <!-- 2. 訊息內容區塊 -->
      <section class="space-y-2 pt-1 border-t border-slate-100 dark:border-slate-800">
        <div class="flex items-center justify-between">
          <label for="messageInput" class="text-sm font-semibold text-slate-700 dark:text-slate-200">
            訊息內容
          </label>
          <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
            <span id="charCount">0 字</span>
            <button type="button" id="clearBtn" class="text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 font-medium transition-colors px-2 py-0.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50 cursor-pointer" title="清空輸入框">
              清空
            </button>
          </div>
        </div>

        <div class="relative">
          <textarea id="messageInput" rows="4" placeholder="點擊下方「📋 讀取剪貼簿」，或直接長按此處貼上你要傳送的文字..." class="w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 p-3.5 text-base text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 focus:bg-white dark:focus:bg-slate-800 transition-all resize-y leading-relaxed"></textarea>
        </div>

        <!-- 讀取剪貼簿按鈕 -->
        <button type="button" id="readClipboardBtn" class="w-full py-3.5 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200/80 active:scale-[0.99] dark:bg-slate-800 dark:hover:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-semibold text-sm sm:text-base flex items-center justify-center gap-2 transition-all border border-slate-200/60 dark:border-slate-700/60 cursor-pointer">
          <span>📋</span>
          <span>讀取剪貼簿</span>
        </button>
      </section>

      <!-- 3. 雙模式開啟 IG 按鈕（解決點不開的問題） -->
      <section class="space-y-3 pt-1">
        <!-- 主按鈕：漸層 IG 品牌色（官方通用通道 ig.me/m/） -->
        <button type="button" id="officialSendBtn" class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-[#f09433] via-[#dc2743] to-[#bc1888] hover:opacity-95 active:scale-[0.98] text-white font-bold text-base shadow-lg shadow-pink-500/25 flex items-center justify-center gap-2 transition-all cursor-pointer">
          <span>🚀</span>
          <span>複製文字並開啟對話框（官方通道）</span>
        </button>

        <!-- 次要按鈕：深色外框按鈕（嘗試直接跳出框架呼叫 App 協定） -->
        <button type="button" id="appSchemeBtn" class="w-full py-3.5 px-5 rounded-2xl bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800/80 active:scale-[0.98] text-slate-800 dark:text-slate-200 border-2 border-slate-800 dark:border-slate-600 font-semibold text-sm sm:text-base flex items-center justify-center gap-2 transition-all cursor-pointer">
          <span>⚡</span>
          <span>嘗試直接帶入文字（App 協定）</span>
        </button>
      </section>

      <!-- 4. 獨立使用引導區（折疊面板） -->
      <section class="pt-2">
        <details class="group rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700/70 overflow-hidden" open="">
          <summary class="list-none flex items-center justify-between p-3.5 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 cursor-pointer select-none hover:bg-slate-100/70 dark:hover:bg-slate-800 transition-colors">
            <span class="flex items-center gap-2">
              <span>💡</span>
              <span>為什麼在預覽畫面可能無法直接跳轉？</span>
            </span>
            <svg class="w-4 h-4 text-slate-400 transition-transform duration-200 group-open:rotate-180 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
            </svg>
          </summary>
          
          <div class="px-4 pb-4 pt-2 text-xs text-slate-600 dark:text-slate-300 space-y-3 border-t border-slate-200/50 dark:border-slate-700/50 leading-relaxed">
            <p>
              瀏覽器的安全沙盒（iFrame 預覽視窗）會攔截 <code class="px-1 py-0.5 bg-slate-200 dark:bg-slate-700 rounded">instagram://</code> 自訂網址協定，因此改用 Meta 官方的 <code class="px-1 py-0.5 bg-slate-200 dark:bg-slate-700 rounded">https://ig.me/m/帳號</code> 通用連結能穩定在新分頁喚醒 IG App 並直達聊天室。
            </p>
            <p>
              <strong class="text-slate-800 dark:text-slate-100">獨立存檔更順暢：</strong><br>
              點擊下方按鈕複製完整原始碼，貼入 iPhone「備忘錄」後儲存到「檔案」並將副檔名改為 <code class="px-1 py-0.5 bg-slate-200 dark:bg-slate-700 rounded">.html</code>，即可在手機上獨立開啟使用！
            </p>
            <button type="button" id="copySourceBtn" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-[0.99] text-white font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm transition-all cursor-pointer">
              <span>📄</span>
              <span>複製網頁原始碼（存成 .html 獨立使用）</span>
            </button>
          </div>
        </details>
      </section>

    </div>
  </main>

  <!-- 隱藏的輔助複製用輸入框（確保在 iFrame 環境下也能透過 execCommand 順利複製） -->
  <textarea id="fallbackCopyArea" class="sr-only" aria-hidden="true"></textarea>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 取得 DOM 元素
      const messageInput = document.getElementById('messageInput');
      const charCount = document.getElementById('charCount');
      const clearBtn = document.getElementById('clearBtn');
      const readClipboardBtn = document.getElementById('readClipboardBtn');
      const usernameInput = document.getElementById('usernameInput');
      const clearUserBtn = document.getElementById('clearUserBtn');
      const officialSendBtn = document.getElementById('officialSendBtn');
      const appSchemeBtn = document.getElementById('appSchemeBtn');
      const copySourceBtn = document.getElementById('copySourceBtn');
      const statusToast = document.getElementById('statusToast');
      const statusIcon = document.getElementById('statusIcon');
      const statusText = document.getElementById('statusText');
      const fallbackCopyArea = document.getElementById('fallbackCopyArea');

      let toastTimeout = null;

      // 顯示友善狀態提示訊息（取代原生 alert）
      function showToast(message, type = 'info') {
        if (toastTimeout) clearTimeout(toastTimeout);

        statusToast.className = 'rounded-2xl p-3.5 text-xs sm:text-sm font-medium flex items-start gap-2.5 transition-all duration-200';
        
        if (type === 'success') {
          statusToast.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200', 'dark:bg-emerald-950/60', 'dark:text-emerald-200', 'dark:border-emerald-800/60');
          statusIcon.textContent = '✅';
        } else if (type === 'warning') {
          statusToast.classList.add('bg-amber-50', 'text-amber-800', 'border', 'border-amber-200', 'dark:bg-amber-950/60', 'dark:text-amber-200', 'dark:border-amber-800/60');
          statusIcon.textContent = '⚠️';
        } else {
          statusToast.classList.add('bg-sky-50', 'text-sky-800', 'border', 'border-sky-200', 'dark:bg-sky-950/60', 'dark:text-sky-200', 'dark:border-sky-800/60');
          statusIcon.textContent = '💡';
        }

        statusText.textContent = message;
        statusToast.classList.remove('hidden');

        // 6 秒後自動隱藏
        toastTimeout = setTimeout(() => {
          statusToast.classList.add('hidden');
        }, 6000);
      }

      // 更新字數統計
      function updateCharCount() {
        const length = messageInput.value.length;
        charCount.textContent = `${length} 字`;
      }

      // 清理並格式化 IG 帳號（移除開頭 @ 與空白）
      function getCleanUsername() {
        return usernameInput.value.trim().replace(/^@+/, '');
      }

      // 切換清除帳號按鈕顯示狀態並自動儲存至 localStorage
      function handleUsernameChange() {
        const cleanUser = getCleanUsername();
        if (cleanUser.length > 0) {
          clearUserBtn.classList.remove('hidden');
          try {
            localStorage.setItem('ig_quick_sender_username', cleanUser);
          } catch (e) {}
        } else {
          clearUserBtn.classList.add('hidden');
          try {
            localStorage.removeItem('ig_quick_sender_username');
          } catch (e) {}
        }
      }

      // 雙重保險複製文字到剪貼簿（同時支援 Clipboard API 與 iFrame 兼容的 execCommand）
      async function copyTextSafely(text) {
        if (!text) return false;
        let copied = false;

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch (err) {
          // 忽略錯誤，繼續執行傳統備援方案
        }

        try {
          fallbackCopyArea.value = text;
          fallbackCopyArea.classList.remove('sr-only');
          fallbackCopyArea.select();
          fallbackCopyArea.setSelectionRange(0, 999999);
          const execSuccess = document.execCommand('copy');
          fallbackCopyArea.classList.add('sr-only');
          if (execSuccess) copied = true;
        } catch (err) {
          fallbackCopyArea.classList.add('sr-only');
        }

        return copied;
      }

      // 讀取剪貼簿功能
      async function handleReadClipboard(isAuto = false) {
        try {
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            throw new Error('Clipboard API unavailable');
          }
          const text = await navigator.clipboard.readText();
          if (text && text.trim().length > 0) {
            messageInput.value = text;
            updateCharCount();
            if (!isAuto) {
              showToast('已成功讀取剪貼簿內容！', 'success');
            }
          } else if (!isAuto) {
            showToast('剪貼簿目前是空的，請先複製文字後再試。', 'warning');
          }
        } catch (err) {
          if (!isAuto) {
            messageInput.focus();
            showToast('請長按輸入框並點選『貼上』', 'warning');
          }
        }
      }

      // 載入儲存的最近輸入 IG 帳號
      try {
        const savedUser = localStorage.getItem('ig_quick_sender_username');
        if (savedUser) {
          usernameInput.value = savedUser;
          clearUserBtn.classList.remove('hidden');
        }
      } catch (e) {}

      // 監聽輸入事件
      messageInput.addEventListener('input', updateCharCount);
      usernameInput.addEventListener('input', handleUsernameChange);

      // 清空訊息按鈕
      clearBtn.addEventListener('click', () => {
        messageInput.value = '';
        updateCharCount();
        messageInput.focus();
      });

      // 清除帳號按鈕
      clearUserBtn.addEventListener('click', () => {
        usernameInput.value = '';
        handleUsernameChange();
        usernameInput.focus();
        showToast('已清除記憶的 IG 帳號。', 'info');
      });

      // 點擊「📋 讀取剪貼簿」
      readClipboardBtn.addEventListener('click', () => handleReadClipboard(false));

      // 主按鈕：「🚀 複製文字並開啟對話框（官方通道）」
      officialSendBtn.addEventListener('click', async () => {
        const msg = messageInput.value;
        const cleanUser = getCleanUsername();

        // 若有輸入文字，先雙重保險複製到剪貼簿
        if (msg.trim().length > 0) {
          await copyTextSafely(msg);
        }

        if (cleanUser) {
          const targetUrl = `https://ig.me/m/${encodeURIComponent(cleanUser)}`;
          showToast(
            msg.trim()
              ? `已複製文字！正在開啟 @${cleanUser} 對話框，進入後直接貼上即可。`
              : `正在透過官方通道開啟 @${cleanUser} 對話框...`,
            'success'
          );
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        } else {
          const inboxUrl = 'https://www.instagram.com/direct/inbox/';
          showToast('已複製文字！進入聊天室後直接貼上即可', 'success');
          window.open(inboxUrl, '_blank', 'noopener,noreferrer');
        }
      });

      // 次要按鈕：「⚡ 嘗試直接帶入文字（App 協定）」
      appSchemeBtn.addEventListener('click', async () => {
        const msg = messageInput.value;
        if (!msg.trim()) {
          showToast('請先讀取剪貼簿或輸入要帶入的文字內容！', 'warning');
          messageInput.focus();
          return;
        }

        await copyTextSafely(msg);
        showToast('已複製文字，正在嘗試跳出框架喚醒 Instagram App...', 'info');

        const encodedMsg = encodeURIComponent(msg);
        const appUrl = `instagram://direct?text=${encodedMsg}`;

        try {
          window.top.location.href = appUrl;
        } catch (e) {
          window.location.href = appUrl;
        }
      });

      // 複製整份網頁原始碼按鈕
      copySourceBtn.addEventListener('click', async () => {
        // 複製前先清空動態狀態，確保原始碼乾淨
        const fullHtmlSource = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const ok = await copyTextSafely(fullHtmlSource);
        if (ok) {
          showToast('已複製原始碼！可貼入備忘錄並存成 .html 檔案獨立使用。', 'success');
        } else {
          showToast('複製失敗，請長按或全選頁面程式碼手動複製。', 'warning');
        }
      });

      // 頁面載入時安靜地嘗試讀取一次剪貼簿
      handleReadClipboard(true);
    });
  </script>

</body></html>
